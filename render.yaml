services:
  - type: web
    name: campus-signals-demo-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DEMO_MODE
        value: "true"
      - key: CORS_ORIGINS
        sync: false
